# Propuesta para ~/.kiro/settings/permissions.yaml (ámbito de usuario)
# Versión 2 (2026-10-08). Basada en los comandos que usaron los workflows del GDD
# (.agents/tasks/*-verificacion.md) y en la revisión de la versión 1.
#
# Cómo aplicarla: copia este contenido a C:\Users\TCN400340\.kiro\settings\permissions.yaml
# (reemplaza el archivo actual; la regla "$_.FullName *" que ya tenías está incluida abajo).
# Los agentes no pueden escribir en ~/.kiro/settings, así que la copia es manual.
#
# Reglas generales:
# - Precedencia: deny > ask > allow, sin importar el orden ni el ámbito.
# - Kiro divide los comandos compuestos ("|", ";") y evalúa cada segmento por separado.
#   Los bloques { } y las subexpresiones $( ) NO se dividen: por eso los patrones de
#   escritura y borrado empiezan con "*", para detectarlos dentro de esos bloques.
# - Lo que no coincide con ninguna regla pide confirmación.
# - Los patrones protegen contra accidentes de los agentes, no contra un comando escrito
#   a propósito para saltarlos. La protección real es el control de versiones (git).
# - Pendiente de comprobar: si los patrones distinguen mayúsculas y minúsculas
#   (PowerShell no las distingue) y si fs_read/fs_write normalizan "/" y "\".

rules:
  # ---------------------------------------------------------------
  # DENY: operaciones destructivas. Nada puede saltarse estas reglas.
  # ---------------------------------------------------------------
  - capability: shell
    effect: deny
    match:
      # Borrado recursivo (cmdlet y alias de PowerShell, y cmd)
      - "*Remove-Item*-Recurse*"
      - "*rm -r*"
      - "*rm *-Recurse*"
      - "*ri *-Recurse*"
      - "*del *-Recurse*"
      - "*del /s*"
      - "rd *"
      - "*{ rd *"
      - "rmdir *"
      - "*{ rmdir *"
      - "erase *"
      - "*{ erase *"
      - "*Format-Volume*"
      # Git destructivo (el GDD está dentro del repo C:\Users\TCN400340\Documents\Codigos)
      - "*git reset --hard*"
      - "*git clean*"
      - "*git branch -D*"
      - "*git push --force*"
      - "*git push -f*"
      - "*git push * --force*"
      - "*git checkout -- *"
      - "*git restore *"
      - "*git stash drop*"
      - "*git stash clear*"
      # Ejecución de código arbitrario
      - "*Invoke-Expression*"
      - "iex"
      - "iex *"
      - "*-EncodedCommand*"

  - capability: fs_write
    effect: deny
    match:
      - "**/.git/**"

  # ---------------------------------------------------------------
  # ASK: siguen pidiendo confirmación.
  # ---------------------------------------------------------------

  # Git que modifica el repositorio. Los workflows del GDD tienen prohibido hacer commits;
  # si un agente lo intenta, te enterarás.
  - capability: shell
    effect: ask
    match:
      - "git add*"
      - "git commit*"
      - "git push*"
      - "git stash*"
      - "git checkout*"
      - "git switch*"
      - "git merge*"
      - "git rebase*"

  # Red y publicación
  - capability: shell
    effect: ask
    match:
      - "*Invoke-WebRequest*"
      - "*Invoke-RestMethod*"
      - "*Start-BitsTransfer*"
      - "iwr *"
      - "irm *"
      - "curl *"
      - "wget *"

  # Escritura, borrado y movimiento desde la terminal, en cualquier parte del comando.
  # Los agentes deben escribir con las herramientas de archivos (fs_write), no con la shell.
  # Incluye Copy-Item: la copia de respaldo se hace leyendo el archivo y escribiéndolo con fs_write.
  - capability: shell
    effect: ask
    match:
      - "*Set-Content*"
      - "*Add-Content*"
      - "*Clear-Content*"
      - "*Out-File*"
      - "*Tee-Object*"
      - "*Remove-Item*"
      - "*Move-Item*"
      - "*Rename-Item*"
      - "*Copy-Item*"
      - "*New-Item*"
      - "*Set-ItemProperty*"
      - "*[System.IO.File]::Write*"
      - "*[IO.File]::Write*"
      - "*[System.IO.File]::Delete*"
      - "*[IO.File]::Delete*"
      - "*.Delete()*"
      - "* > *"
      - "* >> *"

  # Shells anidadas y procesos externos (permitirían saltarse todo lo anterior)
  - capability: shell
    effect: ask
    match:
      - "*Start-Process*"
      - "pwsh *"
      - "powershell *"
      - "cmd *"
      - "& *"

  # Archivos de la bóveda que los workflows no deben tocar
  - capability: fs_write
    effect: ask
    match:
      - "**/Christian Decisions.md"
      - "**/README.md"
      - "**/.obsidian/**"
      - "**/snippets/**"

  # ---------------------------------------------------------------
  # ALLOW: lectura y escritura de archivos dentro de la bóveda del GDD
  # (se incluyen las dos formas de ruta porque no está confirmado si se normalizan)
  # ---------------------------------------------------------------
  - capability: fs_read
    effect: allow
    match:
      - "./**"
      - "C:/Users/TCN400340/Documents/Codigos/GDD/**"
      - 'C:\Users\TCN400340\Documents\Codigos\GDD\**'

  - capability: fs_write
    effect: allow
    match:
      - "./**"
      - "C:/Users/TCN400340/Documents/Codigos/GDD/**"
      - 'C:\Users\TCN400340\Documents\Codigos\GDD\**'

  # ---------------------------------------------------------------
  # ALLOW: comandos de solo lectura que usan los workflows del GDD
  # (las reglas ask de arriba siguen ganando si el comando contiene escritura)
  # ---------------------------------------------------------------
  - capability: shell
    effect: allow
    match:
      # Regla que ya tenías
      - "$_.FullName *"

      # Búsqueda y lectura
      - "Get-ChildItem*"
      - "Select-String*"
      - "Get-Content*"
      - "Get-Item *"
      - "Get-ItemProperty*"
      - "Test-Path*"
      - "Resolve-Path*"
      - "Join-Path*"
      - "Split-Path*"
      - "Get-FileHash*"
      - "Get-Location*"
      - "Get-Date*"
      - "[System.IO.File]::ReadAllLines*"
      - "[System.IO.File]::ReadAllText*"

      # Cmdlets de tubería
      - "Where-Object*"
      - "ForEach-Object*"
      - "Select-Object*"
      - "Sort-Object*"
      - "Group-Object*"
      - "Measure-Object*"
      - "Compare-Object*"
      - "Format-Table*"
      - "Format-List*"
      - "Out-String*"
      - "Write-Output*"
      - "Write-Host*"

      # Asignaciones, conteos y control de flujo usados en las verificaciones
      - "$* = Get-Content *"
      - "$* = Get-ChildItem *"
      - "$* = Select-String *"
      - "(Get-Content *"
      - "(Get-ChildItem *"
      - "(Select-String *"
      - "[Console]::OutputEncoding*"
      - "for (*"
      - "for(*"
      - "foreach (*"
      - "foreach(*"
      - "if (*"
      - "if(*"
      - "Start-Sleep*"

      # Git de solo lectura
      - "git status*"
      - "git diff*"
      - "git log*"
      - "git show*"
      - "git rev-parse*"
      - "git hash-object*"
      - "git ls-files*"
      - "git blame*"
      - "git --no-pager diff*"
      - "git --no-pager log*"
      - "git --no-pager show*"
